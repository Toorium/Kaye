[package]
name = "kaye"
version = "0.1.0"
edition = "2024"
description = "A Blender-style animation tool built only for Roblox rigs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37.0"
glam = { version = "0.34.2", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico"] }
pollster = "0.4.0"
rbx_binary = "3.0.1"
rbx_dom_weak = "4.2.0"
rbx_types = "3.1.0"
rbx_xml = "3.0.1"
resvg = { version = "0.49.0", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ustr = "1.1.0"

[features]
# Scripted UI testing: see src/devscript.rs.
devtools = []

# Without devtools, KAYE_SETTINGS is ignored and a run would touch the real settings.
[[example]]
name = "frametime"
required-features = ["devtools"]

# Keep debug builds usable: unoptimized wgpu and egui are very slow.
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
