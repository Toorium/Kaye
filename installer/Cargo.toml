[package]
name = "kaye-setup"
version.workspace = true
edition = "2024"
description = "Kaye's installer, for Windows"
publish = false

[lib]
name = "kaye_setup"
path = "src/lib.rs"

[[bin]]
name = "kaye-setup"
path = "src/main.rs"

# Puts Kaye on the end of the setup program. See src/pack.rs.
[[bin]]
name = "kaye-pack"
path = "src/bin/kaye-pack.rs"

[dependencies]
crc32fast = "1"
flate2 = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# Only so a test can hold the `.kaye` registry entries to the ones Kaye writes itself. The
# installer stays small because it doesn't link any of Kaye.
[dev-dependencies]
kaye = { path = ".." }

[features]
# For test runs, everything it installs stays inside KAYE_SETUP_ROOT.
devtools = []

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
winresource = "0.1.34"
